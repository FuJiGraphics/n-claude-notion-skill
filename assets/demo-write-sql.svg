<svg xmlns="http://www.w3.org/2000/svg" width="780" height="370" viewBox="0 0 780 370" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">
  <rect width="780" height="370" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect width="780" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="780" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="60" cy="17" r="5.5" fill="#28c840"/>
  <text x="390" y="21" fill="#8b949e" text-anchor="middle" font-size="11.5">notion write + sql - rows in, answers out</text>
  <rect width="0" height="0" fill="none"><animate id="lp" attributeName="width" from="0" to="0" dur="12.90s" repeatCount="indefinite"/></rect>
  <rect x="18" y="342.55" width="8" height="14" fill="#7ee787" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0" begin="lp.begin+9.80s" dur="3.10s" fill="freeze"/>
  </rect>
<text x="18" y="58" fill="#7ee787" opacity="0">$ notion write &lt;db-url&gt; &#x27;파티클 이펙트&#x27; --prop &#x27;상태=대기&#x27; --prop &#x27;우선순위=3&#x27;<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+0.95s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="79" fill="#7ee787" opacity="0">CREATED(row): 파티클 이펙트<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+2.10s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="100" fill="#8b949e" opacity="0">URL: https://app.notion.com/p/...<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+2.65s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="142" fill="#7ee787" opacity="0">$ notion sql &#x27;SELECT 상태, COUNT(*) AS n, AVG(우선순위) AS pri<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+4.00s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="163" fill="#7ee787" opacity="0">              FROM t GROUP BY 상태 ORDER BY n DESC&#x27; --db &lt;db-url&gt;<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+4.55s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="184" fill="#8b949e" opacity="0">t: 7행, 컬럼: 상태, 우선순위, 마감일, 이름, id, url<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+5.60s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="205" fill="#c9d1d9" opacity="0">| 상태   | n | pri |<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+6.35s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="226" fill="#8b949e" opacity="0">|--------|---|-----|<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+6.90s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="247" fill="#c9d1d9" opacity="0">| 진행중 | 4 | 1.5 |<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+7.45s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="268" fill="#c9d1d9" opacity="0">| 대기   | 2 | 2.5 |<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+8.00s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="289" fill="#c9d1d9" opacity="0">| 완료   | 1 | 1.0 |<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+8.55s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="331" fill="#8b949e" opacity="0">(로컬 SQLite - 조인/집계/서브쿼리, 읽기 전용)<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+9.40s" dur="0.15s" fill="freeze"/></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="780" height="308" viewBox="0 0 780 308" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">
  <rect width="780" height="308" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect width="780" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="780" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="60" cy="17" r="5.5" fill="#28c840"/>
  <text x="390" y="21" fill="#8b949e" text-anchor="middle" font-size="11.5">notion read - database as a table</text>
  <rect width="0" height="0" fill="none"><animate id="lp" attributeName="width" from="0" to="0" dur="9.55s" repeatCount="indefinite"/></rect>
  <rect x="18" y="279.55" width="8" height="14" fill="#7ee787" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0" begin="lp.begin+6.45s" dur="3.10s" fill="freeze"/>
  </rect>
<text x="18" y="58" fill="#7ee787" opacity="0">$ notion read &lt;db-url&gt; --filter &#x27;상태=대기&#x27; --sort &#x27;-우선순위&#x27;<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+0.95s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="100" fill="#79c0ff" opacity="0"># 🗃️ 작업 보드<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+2.00s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="121" fill="#8b949e" opacity="0">경로: 개발 &gt; 프로젝트<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+2.55s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="142" fill="#8b949e" opacity="0">properties: 상태(select), 우선순위(number), 마감일(date), 이름(title)<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+3.10s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="184" fill="#79c0ff" opacity="0">## Rows (2행)<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+3.85s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="205" fill="#c9d1d9" opacity="0">| 이름            | 상태 | 우선순위 | 마감일     | id        |<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+4.40s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="226" fill="#8b949e" opacity="0">|-----------------|------|----------|------------|-----------|<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+4.95s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="247" fill="#c9d1d9" opacity="0">| 파티클 이펙트   | 대기 | 3        | 2026-08-20 | 3bd9c6... |<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+5.50s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="268" fill="#c9d1d9" opacity="0">| 팝업 리팩토링   | 대기 | 2        | 2026-08-22 | 3bd9c6... |<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+6.05s" dur="0.15s" fill="freeze"/></text>
</svg>

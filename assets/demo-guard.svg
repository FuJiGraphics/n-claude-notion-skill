<svg xmlns="http://www.w3.org/2000/svg" width="780" height="267" viewBox="0 0 780 267" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">
  <rect width="780" height="267" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect width="780" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="780" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="60" cy="17" r="5.5" fill="#28c840"/>
  <text x="390" y="21" fill="#8b949e" text-anchor="middle" font-size="11.5">allowlist guard - real docs stay safe</text>
  <rect width="0" height="0" fill="none"><animate id="lp" attributeName="width" from="0" to="0" dur="10.65s" repeatCount="indefinite"/></rect>
  <rect x="18" y="237.55" width="8" height="14" fill="#7ee787" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0" begin="lp.begin+7.55s" dur="3.10s" fill="freeze"/>
  </rect>
<text x="18" y="58" fill="#7ee787" opacity="0">$ notion write &lt;회사-기획서-url&gt; &#x27;메모&#x27; --text &#x27;실수로 쓰는 중...&#x27;<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+0.95s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="79" fill="#f85149" opacity="0">WRITE_DENIED: 3b39c685-... 는 로컬 쓰기 허용목록 밖.<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+2.20s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="100" fill="#8b949e" opacity="0">Notion 권한 문제 아님 - 토큰은 공유된 모든 페이지에 쓰기 가능하지만,<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+2.95s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="121" fill="#8b949e" opacity="0">실문서 보호를 위해 이 도구가 자체적으로 막는 것.<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+3.50s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="163" fill="#7ee787" opacity="0">$ notion write &lt;내-작업공간-url&gt; &#x27;메모&#x27; --text &#x27;여기는 허용된 영역&#x27;<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+5.05s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="184" fill="#7ee787" opacity="0">CREATED: 메모<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+6.20s" dur="0.15s" fill="freeze"/></text>
<text x="18" y="226" fill="#8b949e" opacity="0">쓰기 가드는 프롬프트가 아니라 코드 - 조상 체인을 API 로 검증한다.<animate attributeName="opacity" to="0" begin="lp.begin" dur="0.01s" fill="freeze"/><animate attributeName="opacity" to="1" begin="lp.begin+7.15s" dur="0.15s" fill="freeze"/></text>
</svg>
